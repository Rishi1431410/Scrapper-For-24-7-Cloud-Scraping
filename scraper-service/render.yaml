services:
  - type: web
    name: aurabuy-scraper-service
    env: node
    plan: free
    region: oregon
    rootDir: scraper-service
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: MUMBAI_PINCODE
        value: 400001
      - key: SCRAPERAPI_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: RAINFOREST_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
